[build]
  publish = "/"

# Ancienne page d'accueil
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Anciennes URLs .html -> URLs propres
[[redirects]]
  from = "/referencement.html"
  to = "/referencement/"
  status = 301
  force = true

[[redirects]]
  from = "/reseaux-sociaux.html"
  to = "/reseaux-sociaux/"
  status = 301
  force = true

[[redirects]]
  from = "/a-propos.html"
  to = "/a-propos/"
  status = 301
  force = true

[[redirects]]
  from = "/tarifs.html"
  to = "/tarifs/"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
  force = true

# Headers de cache pour les assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
